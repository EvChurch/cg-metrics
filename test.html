<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ev Church - Connect Group Metrics</title>
</head>

<body style="margin: 0; padding: 0 24px">
  <style>
    iframe {
      width: 100%;
      height: 100svh;
    }
  </style>
  <iframe id="cg-metrics-iframe" src="." frameborder="0"></iframe>
  <script src="https://cdn.jsdelivr.net/npm/@iframe-resizer/parent@5.5.7"></script>
  <script>
    const iframe = document.getElementById("cg-metrics-iframe");
    let testData;

    function sendTestData() {
      if (!testData || !iframe.contentWindow) return;
      iframe.contentWindow.postMessage({ target: "cg-metrics", data: testData }, "*");
    }

    iframe.addEventListener("load", sendTestData);
    window.addEventListener("message", (event) => {
      if (event.source === iframe.contentWindow && event.data?.type === "CG_METRICS_READY") {
        sendTestData();
      }
    });

    iframeResize({ license: "GPLv3" }, "#cg-metrics-iframe");
    fetch("./test-data.json")
      .then((response) => response.json())
      .then((data) => {
        testData = data;
        sendTestData();
      });
  </script>
</body>

</html>
